<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Live Character Counter & Dark Mode</title>
    <link rel="stylesheet" href="style.css" />
    <script src="script.js" defer></script>
  </head>
  <body>
    <label for="note-text">Enter your text:</label>
    <textarea id="note-text" placeholder="Type something..."></textarea>

    <p id="char-count"></p>
    <p id="word-count"></p>

    <button id="clear-btn">Clear Text</button>
    <button id="theme-toggle">Toggle Dark Mode</button>
  </body>
</html>
